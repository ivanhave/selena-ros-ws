# Gripper tray position in gantry frame.
# All values in meters, relative to gantry home (all axes at 0).
#
# TODO: measure physically once tray is mounted and update these values.
#
# How to use:
#   ros2 run robot_missions mission_server \
#     --ros-args --params-file $(ros2 pkg prefix robot_missions)/share/robot_missions/config/tray_positions.yaml

mission_server:
  ros__parameters:
    gripper_tray:
      gx: 0.800        # gantry X position of tray center (meters from home)
      gy: 0.200        # gantry Y position of tray center (meters from home)
      z_approach: 0.150  # intermediate safe height before lowering (currently unused in code)
      z_pick: 0.220    # Z height at which gripper closes on seed (meters from home)
    soil_surface_z_m: 0.220  # distance from Z-home to soil/floor surface (FlatGroundDepthSensor)
